<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1450" width="720" height="1450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CA6F1E"/>
    </marker>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CA6F1E"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
    <linearGradient id="convGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECF0F1"/>
      <stop offset="100%" style="stop-color:#D5DBDB"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1450" fill="#FAFBFC"/>

  <!-- 标题栏 -->
  <rect x="30" y="15" width="660" height="55" rx="8" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="360" y="38" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">GAT 模型结构图</text>
  <text x="360" y="57" text-anchor="middle" fill="#FDEBD0" font-size="11">Graph Attention Network · 图注意力网络 · 注意力加权邻居聚合</text>

  <!-- 输入层 -->
  <rect x="100" y="85" width="520" height="45" rx="8" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="105" text-anchor="middle" fill="#7D6608" font-size="13" font-weight="bold">📥 输入数据</text>
  <text x="360" y="121" text-anchor="middle" fill="#555" font-size="10">x ∈ ℝⁿˣᵈ · edge_index ∈ ℤ²ˣᴱ · batch ∈ ℕⁿ</text>

  <!-- DepressionClassifier 外框 -->
  <rect x="70" y="145" width="580" height="1180" rx="10" fill="#F0F3F4" stroke="#707B7C" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <text x="90" y="170" fill="#2C3E50" font-size="14" font-weight="bold">DepressionClassifier</text>
  <text x="260" y="170" fill="#7F8C8D" font-size="11">· model_type = 'gat'</text>

  <!-- GATModel 外框 -->
  <rect x="100" y="190" width="520" height="950" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="120" y="215" fill="#CA6F1E" font-size="13" font-weight="bold">GATModel</text>
  <text x="220" y="215" fill="#95A5A6" font-size="10">· 图神经网络编码器</text>

  <!-- GATConv1 -->
  <rect x="130" y="235" width="460" height="60" rx="6" fill="url(#convGrad)" stroke="#E67E22" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" fill="#2C3E50" font-size="13" font-weight="bold">GATConv · 第一层图注意力卷积</text>
  <text x="360" y="274" text-anchor="middle" fill="#5D6D7E" font-size="10">d_in → 64 (heads=4, concat=False)</text>

  <line x1="360" y1="295" x2="360" y2="310" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 注意力机制1 -->
  <rect x="160" y="315" width="400" height="50" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="360" y="334" text-anchor="middle" fill="#CA6F1E" font-size="11" font-weight="bold">⚡ 多头注意力机制 (4 heads)</text>
  <text x="360" y="352" text-anchor="middle" fill="#B7950B" font-size="9">α_ij = softmax(LeakyReLU(aᵀ[Wh_i || Wh_j])) · h_i' = σ(Σ_j α_ij Wh_j)</text>

  <line x1="360" y1="365" x2="360" y2="380" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BatchNorm1d + ReLU -->
  <rect x="130" y="385" width="460" height="42" rx="6" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="360" y="410" text-anchor="middle" fill="#1A5276" font-size="12" font-weight="bold">BatchNorm1d → ReLU</text>

  <line x1="360" y1="427" x2="360" y2="442" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dropout1 -->
  <rect x="130" y="447" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="472" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="489" x2="360" y2="504" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GATConv2 -->
  <rect x="130" y="509" width="460" height="60" rx="6" fill="url(#convGrad)" stroke="#E67E22" stroke-width="2"/>
  <text x="360" y="530" text-anchor="middle" fill="#2C3E50" font-size="13" font-weight="bold">GATConv · 第二层图注意力卷积</text>
  <text x="360" y="548" text-anchor="middle" fill="#5D6D7E" font-size="10">64 → 64 (heads=4, concat=False)</text>

  <line x1="360" y1="569" x2="360" y2="584" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 注意力机制2 -->
  <rect x="160" y="589" width="400" height="50" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="360" y="608" text-anchor="middle" fill="#CA6F1E" font-size="11" font-weight="bold">⚡ 多头注意力机制 (4 heads)</text>
  <text x="360" y="626" text-anchor="middle" fill="#B7950B" font-size="9">α_ij = softmax(LeakyReLU(aᵀ[Wh_i || Wh_j])) · h_i' = σ(Σ_j α_ij Wh_j)</text>

  <line x1="360" y1="639" x2="360" y2="654" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BatchNorm1d + ReLU -->
  <rect x="130" y="659" width="460" height="42" rx="6" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="360" y="684" text-anchor="middle" fill="#1A5276" font-size="12" font-weight="bold">BatchNorm1d → ReLU</text>

  <line x1="360" y1="701" x2="360" y2="716" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dropout2 -->
  <rect x="130" y="721" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="746" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="763" x2="360" y2="778" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GlobalMeanPool -->
  <rect x="130" y="783" width="460" height="55" rx="6" fill="#E8DAEF" stroke="#8E44AD" stroke-width="2"/>
  <text x="360" y="804" text-anchor="middle" fill="#6C3483" font-size="13" font-weight="bold">GlobalMeanPool</text>
  <text x="360" y="822" text-anchor="middle" fill="#8E44AD" font-size="10">节点特征 → 图嵌入 ℝ⁶⁴ · 对batch中同一图节点取均值</text>

  <line x1="360" y1="838" x2="360" y2="853" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Linear (FC) -->
  <rect x="130" y="858" width="460" height="42" rx="6" fill="#FADBD8" stroke="#CB4335" stroke-width="2"/>
  <text x="360" y="883" text-anchor="middle" fill="#922B21" font-size="12" font-weight="bold">Linear (64 → 64)</text>

  <line x1="360" y1="900" x2="360" y2="950" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DepressionClassifier 的 Dropout -->
  <rect x="130" y="955" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="980" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="997" x2="360" y2="1012" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分类头 Linear -->
  <rect x="130" y="1017" width="460" height="55" rx="6" fill="#FADBD8" stroke="#CB4335" stroke-width="2"/>
  <text x="360" y="1038" text-anchor="middle" fill="#922B21" font-size="13" font-weight="bold">Linear (64 → 5)</text>
  <text x="360" y="1056" text-anchor="middle" fill="#CB4335" font-size="10">→ Logits ∈ ℝ⁵ · 5级抑郁分类</text>

  <!-- 输出层 -->
  <line x1="360" y1="1072" x2="360" y2="1100" stroke="#CA6F1E" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="80" y="1105" width="560" height="75" rx="8" fill="#D5F5E3" stroke="#1E8449" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="1128" text-anchor="middle" fill="#1E8449" font-size="14" font-weight="bold">📤 输出：PHQ-8 五级抑郁分类</text>
  <text x="360" y="1146" text-anchor="middle" fill="#555" font-size="10">Logits ∈ ℝᴮˣ⁵ → CrossEntropyLoss</text>
  <text x="360" y="1162" text-anchor="middle" fill="#7F8C8D" font-size="9">Level 0：无抑郁(0-4) | Level 1：轻度(5-9) | Level 2：中度(10-14) | Level 3：中重度(15-19) | Level 4：重度(20-24)</text>

  <!-- 图例 -->
  <rect x="60" y="1200" width="600" height="28" rx="4" fill="#ECF0F1" stroke="#E67E22" stroke-width="1.5"/>
  <text x="160" y="1219" text-anchor="middle" fill="#2C3E50" font-size="10">图注意力层 (GATConv)</text>

  <rect x="60" y="1233" width="600" height="28" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="160" y="1252" text-anchor="middle" fill="#CA6F1E" font-size="10">注意力机制 (Multi-Head Attention)</text>

  <rect x="60" y="1266" width="600" height="28" rx="4" fill="#D6EAF8" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="160" y="1285" text-anchor="middle" fill="#1A5276" font-size="10">归一化+激活 (BN→ReLU)</text>

  <rect x="60" y="1299" width="600" height="28" rx="4" fill="#FDEBD0" stroke="#D35400" stroke-width="1.5"/>
  <text x="160" y="1318" text-anchor="middle" fill="#935116" font-size="10">Dropout (p=0.5)</text>

  <rect x="60" y="1332" width="600" height="28" rx="4" fill="#E8DAEF" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="160" y="1351" text-anchor="middle" fill="#6C3483" font-size="10">图池化 (GlobalMeanPool)</text>

  <rect x="60" y="1365" width="600" height="28" rx="4" fill="#FADBD8" stroke="#CB4335" stroke-width="1.5"/>
  <text x="160" y="1384" text-anchor="middle" fill="#922B21" font-size="10">全连接层 (Linear)</text>

  <!-- 公式说明 -->
  <rect x="60" y="1400" width="600" height="35" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="80" y="1416" fill="#5D6D7E" font-size="10">GATConv：引入注意力机制，为每个邻居节点学习自适应权重，heads=4表示4头注意力并行计算，concat=False表示多头输出取平均</text>
  <text x="80" y="1430" fill="#5D6D7E" font-size="10">公式：α_ij = softmax_j(LeakyReLU(aᵀ[Wh_i||Wh_j])) · h_i' = σ(1/K Σ_k Σ_{j∈N(i)} α_ij^k W^k h_j)</text>

  <!-- 维度标注 -->
  <text x="620" y="265" text-anchor="end" fill="#E67E22" font-size="9" font-weight="bold">d_in</text>
  <text x="620" y="539" text-anchor="end" fill="#E67E22" font-size="9" font-weight="bold">64</text>
  <text x="620" y="813" text-anchor="end" fill="#8E44AD" font-size="9" font-weight="bold">ℝ⁶⁴</text>
  <text x="620" y="1047" text-anchor="end" fill="#CB4335" font-size="9" font-weight="bold">ℝ⁵</text>
</svg>
