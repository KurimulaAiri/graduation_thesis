<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1350" width="720" height="1350" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E8449"/>
    </marker>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E8449"/>
      <stop offset="100%" style="stop-color:#27AE60"/>
    </linearGradient>
    <linearGradient id="convGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECF0F1"/>
      <stop offset="100%" style="stop-color:#D5DBDB"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="1350" fill="#FAFBFC" rx="0"/>

  <!-- 标题栏 -->
  <rect x="30" y="15" width="660" height="55" rx="8" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="360" y="38" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">GCN 模型结构图</text>
  <text x="360" y="57" text-anchor="middle" fill="#A9DFBF" font-size="11">Graph Convolutional Network · 图卷积网络 · 均匀邻居聚合</text>

  <!-- 输入层 -->
  <rect x="100" y="85" width="520" height="45" rx="8" fill="#FCF3CF" stroke="#D4AC0D" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="105" text-anchor="middle" fill="#7D6608" font-size="13" font-weight="bold">📥 输入数据</text>
  <text x="360" y="121" text-anchor="middle" fill="#555" font-size="10">x ∈ ℝⁿˣᵈ · edge_index ∈ ℤ²ˣᴱ · batch ∈ ℕⁿ</text>

  <!-- DepressionClassifier 外框 -->
  <rect x="70" y="145" width="580" height="1080" rx="10" fill="#F0F3F4" stroke="#707B7C" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <text x="90" y="170" fill="#2C3E50" font-size="14" font-weight="bold">DepressionClassifier</text>
  <text x="260" y="170" fill="#7F8C8D" font-size="11">· model_type = 'gcn'</text>

  <!-- GCNModel 外框 -->
  <rect x="100" y="190" width="520" height="850" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="120" y="215" fill="#1E8449" font-size="13" font-weight="bold">GCNModel</text>
  <text x="220" y="215" fill="#95A5A6" font-size="10">· 图神经网络编码器</text>

  <!-- GCNConv1 -->
  <rect x="130" y="235" width="460" height="60" rx="6" fill="url(#convGrad)" stroke="#27AE60" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" fill="#2C3E50" font-size="13" font-weight="bold">GCNConv · 第一层图卷积</text>
  <text x="360" y="274" text-anchor="middle" fill="#5D6D7E" font-size="10">d_in → 64 · 谱图卷积一阶近似 · 均匀邻居聚合</text>

  <!-- 箭头 -->
  <line x1="360" y1="295" x2="360" y2="310" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BatchNorm1d + ReLU -->
  <rect x="130" y="315" width="460" height="42" rx="6" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="360" y="336" text-anchor="middle" fill="#1A5276" font-size="12" font-weight="bold">BatchNorm1d → ReLU</text>
  <text x="360" y="350" text-anchor="middle" fill="#2E86C1" font-size="9">批量归一化 + 线性整流激活</text>

  <line x1="360" y1="357" x2="360" y2="372" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dropout1 -->
  <rect x="130" y="377" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="402" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="419" x2="360" y2="434" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GCNConv2 -->
  <rect x="130" y="439" width="460" height="60" rx="6" fill="url(#convGrad)" stroke="#27AE60" stroke-width="2"/>
  <text x="360" y="460" text-anchor="middle" fill="#2C3E50" font-size="13" font-weight="bold">GCNConv · 第二层图卷积</text>
  <text x="360" y="478" text-anchor="middle" fill="#5D6D7E" font-size="10">64 → 64 · 深层特征提取 · 均匀邻居聚合</text>

  <line x1="360" y1="499" x2="360" y2="514" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BatchNorm1d + ReLU -->
  <rect x="130" y="519" width="460" height="42" rx="6" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="360" y="544" text-anchor="middle" fill="#1A5276" font-size="12" font-weight="bold">BatchNorm1d → ReLU</text>

  <line x1="360" y1="561" x2="360" y2="576" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dropout2 -->
  <rect x="130" y="581" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="606" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="623" x2="360" y2="638" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GlobalMeanPool -->
  <rect x="130" y="643" width="460" height="55" rx="6" fill="#E8DAEF" stroke="#8E44AD" stroke-width="2"/>
  <text x="360" y="664" text-anchor="middle" fill="#6C3483" font-size="13" font-weight="bold">GlobalMeanPool</text>
  <text x="360" y="682" text-anchor="middle" fill="#8E44AD" font-size="10">节点特征 → 图嵌入 ℝ⁶⁴ · 对batch中同一图节点取均值</text>

  <line x1="360" y1="698" x2="360" y2="713" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Linear (FC) -->
  <rect x="130" y="718" width="460" height="42" rx="6" fill="#FADBD8" stroke="#CB4335" stroke-width="2"/>
  <text x="360" y="743" text-anchor="middle" fill="#922B21" font-size="12" font-weight="bold">Linear (64 → 64)</text>

  <!-- 从GNN到Classifier的过渡箭头 -->
  <line x1="360" y1="760" x2="360" y2="810" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DepressionClassifier 的 Dropout -->
  <rect x="130" y="815" width="460" height="42" rx="6" fill="#FDEBD0" stroke="#D35400" stroke-width="2"/>
  <text x="360" y="840" text-anchor="middle" fill="#935116" font-size="12" font-weight="bold">Dropout (p=0.5)</text>

  <line x1="360" y1="857" x2="360" y2="872" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分类头 Linear -->
  <rect x="130" y="877" width="460" height="55" rx="6" fill="#FADBD8" stroke="#CB4335" stroke-width="2"/>
  <text x="360" y="898" text-anchor="middle" fill="#922B21" font-size="13" font-weight="bold">Linear (64 → 5)</text>
  <text x="360" y="916" text-anchor="middle" fill="#CB4335" font-size="10">→ Logits ∈ ℝ⁵ · 5级抑郁分类</text>

  <!-- 输出层 -->
  <line x1="360" y1="932" x2="360" y2="960" stroke="#1E8449" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="80" y="965" width="560" height="75" rx="8" fill="#D5F5E3" stroke="#1E8449" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="988" text-anchor="middle" fill="#1E8449" font-size="14" font-weight="bold">📤 输出：PHQ-8 五级抑郁分类</text>
  <text x="360" y="1006" text-anchor="middle" fill="#555" font-size="10">Logits ∈ ℝᴮˣ⁵ → CrossEntropyLoss</text>
  <text x="360" y="1022" text-anchor="middle" fill="#7F8C8D" font-size="9">Level 0：无抑郁(0-4) | Level 1：轻度(5-9) | Level 2：中度(10-14) | Level 3：中重度(15-19) | Level 4：重度(20-24)</text>

  <!-- 图例 -->
  <rect x="60" y="1060" width="600" height="30" rx="4" fill="#ECF0F1" stroke="#27AE60" stroke-width="1.5"/>
  <text x="160" y="1080" text-anchor="middle" fill="#2C3E50" font-size="10">图卷积层 (GCNConv)</text>

  <rect x="60" y="1095" width="600" height="30" rx="4" fill="#D6EAF8" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="160" y="1115" text-anchor="middle" fill="#1A5276" font-size="10">归一化+激活 (BN→ReLU)</text>

  <rect x="60" y="1130" width="600" height="30" rx="4" fill="#FDEBD0" stroke="#D35400" stroke-width="1.5"/>
  <text x="160" y="1150" text-anchor="middle" fill="#935116" font-size="10">Dropout (p=0.5)</text>

  <rect x="60" y="1165" width="600" height="30" rx="4" fill="#E8DAEF" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="160" y="1185" text-anchor="middle" fill="#6C3483" font-size="10">图池化 (GlobalMeanPool)</text>

  <rect x="60" y="1200" width="600" height="30" rx="4" fill="#FADBD8" stroke="#CB4335" stroke-width="1.5"/>
  <text x="160" y="1220" text-anchor="middle" fill="#922B21" font-size="10">全连接层 (Linear)</text>

  <!-- 公式说明 -->
  <rect x="60" y="1245" width="600" height="50" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="80" y="1265" fill="#5D6D7E" font-size="10">GCNConv：基于谱图卷积的Chebyshev一阶近似，对所有邻居节点进行均匀加权聚合</text>
  <text x="80" y="1282" fill="#5D6D7E" font-size="10">公式：h_v^(l) = σ( Σ_{u∈N(v)} (1/√(d_u·d_v)) · W^(l) · h_u^(l-1) )</text>

  <!-- 数据流标注 -->
  <text x="620" y="265" text-anchor="end" fill="#27AE60" font-size="9" font-weight="bold">d_in</text>
  <text x="620" y="469" text-anchor="end" fill="#27AE60" font-size="9" font-weight="bold">64</text>
  <text x="620" y="673" text-anchor="end" fill="#8E44AD" font-size="9" font-weight="bold">ℝ⁶⁴</text>
  <text x="620" y="907" text-anchor="end" fill="#CB4335" font-size="9" font-weight="bold">ℝ⁵</text>
</svg>
